<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2ecc76" />
    <meta name="description" content="DocuMind - AI-Powered Document Intelligence Platform" />
    <title>DocuMind - AI Document Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Book cursor SVG as data URI via CSS - defined in global.css -->
    <style>
      /* Prevent FOUC */
      body { opacity: 0; transition: opacity 0.3s; }
      body.loaded { opacity: 1; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>document.body.classList.add('loaded');</script>
  </body>
</html>
